name: Karnan Kudumbam Backend Tests
on:
  push:
    branches: [ main, karnan-kudumbam-dev, karnan-kudumbam-complete-integration ]
    paths:
      - 'karnan-kudumbam/MadipakkamGroceryManager/backend/**'
      - '.github/workflows/karnan-backend-test.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'karnan-kudumbam/MadipakkamGroceryManager/backend/**'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run backend tests
        working-directory: karnan-kudumbam/MadipakkamGroceryManager/backend
        run: |
          npm install
          npm test
