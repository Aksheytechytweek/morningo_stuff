name: Karnan Kudumbam Signed Android Release
on:
  workflow_dispatch:
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate signing configuration
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          test -n "$KEYSTORE" || { echo "Missing ANDROID_KEYSTORE_BASE64"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing ANDROID_KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing ANDROID_KEY_PASSWORD"; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "Missing ANDROID_STORE_PASSWORD"; exit 1; }
      - name: Restore release keystore
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/karnan-release.jks"
      - name: Build signed Android App Bundle
        working-directory: karnan-kudumbam/MadipakkamGroceryManager
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/karnan-release.jks
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: gradle --no-daemon bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: Karnan-Kudumbam-signed-AAB
          path: karnan-kudumbam/MadipakkamGroceryManager/app/build/outputs/bundle/release/app-release.aab
