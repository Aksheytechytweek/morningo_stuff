name: Karnan Kudumbam Android Debug APK
on:
  workflow_dispatch:
  push:
    branches: [ main, karnan-kudumbam-dev ]
    paths:
      - 'karnan-kudumbam/MadipakkamGroceryManager/**'
      - '.github/workflows/karnan-android-build.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Locate Android SDK manager
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
      - name: Accept Android SDK licences and install platform
        shell: bash
        run: |
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: karnan-kudumbam/MadipakkamGroceryManager
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MadipakkamGroceryManager-debug-apk
          path: karnan-kudumbam/MadipakkamGroceryManager/app/build/outputs/apk/debug/app-debug.apk
