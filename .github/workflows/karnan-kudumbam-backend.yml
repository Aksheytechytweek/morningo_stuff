name: Karnan Kudumbam Backend Tests
on:
  workflow_dispatch:
  push:
    branches: [ main, master, karnan-kudumbam-complete-integration ]
    paths:
      - 'karnan-kudumbam/MadipakkamGroceryManager/backend/**'
      - '.github/workflows/karnan-kudumbam-backend.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: karnan-kudumbam/MadipakkamGroceryManager/backend
        run: npm install
      - name: Run backend tests
        working-directory: karnan-kudumbam/MadipakkamGroceryManager/backend
        run: npm test
